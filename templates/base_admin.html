<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}Admin Portal{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
    <div class="wrap">
        {% if session.get('admin') %}
        <nav class="topnav" aria-label="Admin">
            <a href="{{ url_for('home') }}">Main site</a>
            <a href="{{ url_for('admin') }}">Movies</a>
            <a href="{{ url_for('sales_dashboard') }}">&#128200; Sales Dashboard</a>
            <form action="{{ url_for('logout') }}" method="POST">
                <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
                <button type="submit" class="linkbtn">Log out</button>
            </form>
        </nav>
        {% endif %}
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="flash {{ category }}" role="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
